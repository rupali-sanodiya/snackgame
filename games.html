<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Pro Max - Accurate Version</title>
    <style>
        /* CSS: Modern Dark Theme */
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .game-header {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
        }

        #game-wrapper {
            position: relative;
            border: 4px solid #334155;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            background: #000;
            border-radius: 8px;
            max-width: 90vw;
            max-height: 50vh;
        }

        /* Mobile Controls */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            width: 65px;
            height: 65px;
            background: #1e293b;
            border: 2px solid #334155;
            color: #22c55e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.1s;
        }

        .btn:active { background: #22c55e; color: #000; transform: scale(0.9); }
        .up { grid-column: 2; }
        .left { grid-column: 1; }
        .down { grid-column: 2; }
        .right { grid-column: 3; }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="game-header">
        <div>Score: <span id="score">0</span></div>
        <div>High: <span id="highScore">0</span></div>
    </div>

    <div id="game-wrapper">
        <canvas id="snakeGame" width="400" height="400"></canvas>
        <div id="overlay">
            <h2 style="color: #ef4444; margin-bottom: 10px;">GAME OVER</h2>
            <button onclick="startGame()" style="padding: 10px 20px; cursor: pointer; background: #22c55e; border: none; border-radius: 5px; font-weight: bold;">TRY AGAIN</button>
        </div>
    </div>

    <div class="controls">
        <div class="btn up" onpointerdown="changeDir('UP')">↑</div>
        <div class="btn left" onpointerdown="changeDir('LEFT')">←</div>
        <div class="btn down" onpointerdown="changeDir('DOWN')">↓</div>
        <div class="btn right" onpointerdown="changeDir('RIGHT')">→</div>
    </div>

    <script>
        // JS: Optimized Logic
        const canvas = document.getElementById("snakeGame");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const highEl = document.getElementById("highScore");
        const overlay = document.getElementById("overlay");

        const box = 20;
        let snake, food, d, score, gameInterval;
        let highScore = localStorage.getItem("snakeAccurateHigh") || 0;
        highEl.innerText = highScore;

        function startGame() {
            snake = [{x: 10 * box, y: 10 * box}];
            food = {
                x: Math.floor(Math.random() * 19 + 1) * box,
                y: Math.floor(Math.random() * 19 + 1) * box
            };
            d = null;
            score = 0;
            scoreEl.innerText = score;
            overlay.style.display = "none";
            if(gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(draw, 120);
        }

        function changeDir(dir) {
            if(dir == "LEFT" && d != "RIGHT") d = "LEFT";
            else if(dir == "UP" && d != "DOWN") d = "UP";
            else if(dir == "RIGHT" && d != "LEFT") d = "RIGHT";
            else if(dir == "DOWN" && d != "UP") d = "DOWN";
        }

        document.addEventListener("keydown", (e) => {
            if(e.key == "ArrowLeft") changeDir("LEFT");
            if(e.key == "ArrowUp") changeDir("UP");
            if(e.key == "ArrowRight") changeDir("RIGHT");
            if(e.key == "ArrowDown") changeDir("DOWN");
        });

        function draw() {
            // Clear Canvas
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Snake
            snake.forEach((unit, index) => {
                ctx.fillStyle = index == 0 ? "#22c55e" : "#166534";
                ctx.strokeStyle = "black";
                ctx.fillRect(unit.x, unit.y, box, box);
                ctx.strokeRect(unit.x, unit.y, box, box);
            });

            // Draw Food
            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.arc(food.x + box/2, food.y + box/2, box/2 - 2, 0, Math.PI * 2);
            ctx.fill();

            if(!d) return; // Wait for start

            let headX = snake[0].x;
            let headY = snake[0].y;

            if(d == "LEFT") headX -= box;
            if(d == "UP") headY -= box;
            if(d == "RIGHT") headX += box;
            if(d == "DOWN") headY += box;

            // Accurate Boundary Wrap (Teleport)
            if(headX < 0) headX = canvas.width - box;
            else if(headX >= canvas.width) headX = 0;
            if(headY < 0) headY = canvas.height - box;
            else if(headY >= canvas.height) headY = 0;

            let newHead = {x: headX, y: headY};

            // Game Over: Self Hit
            if(snake.some((unit, i) => i !== 0 && unit.x === newHead.x && unit.y === newHead.y)) {
                clearInterval(gameInterval);
                overlay.style.display = "flex";
                if(score > highScore) {
                    highScore = score;
                    localStorage.setItem("snakeAccurateHigh", highScore);
                    highEl.innerText = highScore;
                }
                return;
            }

            // Food Check
            if(headX == food.x && headY == food.y) {
                score++;
                scoreEl.innerText = score;
                food = {
                    x: Math.floor(Math.random() * 19 + 1) * box,
                    y: Math.floor(Math.random() * 19 + 1) * box
                };
            } else {
                snake.pop();
            }

            snake.unshift(newHead);
        }

        startGame();
    </script>
</body>
</html>
